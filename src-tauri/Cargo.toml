[package]
name = "ds-software"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for DS Software"

[lib]
name = "ds_software"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }

[workspace]
